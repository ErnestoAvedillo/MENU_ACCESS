{% load static %}

<div class="spring-form-container">
    <div class="diagram-wrapper">
        <img src="{% static 'muelles/img/plano_muelle_torsion.jpg' %}" alt="Diagrama de muelle" class="spring-diagram">

        <div class="input-overlay d-field" style="top: 23%; left: 64%;">
            {{ form.d }}
            <span class="label">d</span>
        </div>

        <div class="input-overlay De-field" style="top: 40%; left: 5%;">
            {{ form.De }}
            <span class="label">De</span>
        </div>

        <div class="input-overlay Dm-field" style="top: 40%; left: 13%;">
            {{ form.Dm }}
            <span class="label">Dm</span>
        </div>

        <div class="input-overlay Di-field" style="top: 40%; left: 18%;">
            {{ form.Di }}
            <span class="label">Di</span>
        </div>

        <div class="input-overlay Ls-field" style="top: 25%; left: 47.5%;">
            {{ form.Ls }}
            <span class="label">Ls</span>
        </div>
        <div class="input-overlay Rm-field" style="top: 55%; left: 20%;">
            {{ form.Rm }}
            <span class="label">Rm</span>
        </div>
        <div class="input-overlay A1-field" style="top: 67%; left: 33%;">
            {{ form.A1 }}
            <span class="label">A1</span>
        </div>
        <div class="input-overlay A2-field" style="top: 65%; left: 48%;">
            {{ form.A2 }}
            <span class="label">A2</span>
        </div>
        <div class="input-overlay nt-field" style="top: 38%; left: 85%;">
            {{ form.nt }}
            <span class="label">nt</span>
        </div>
        <div class="input-overlay pitch-field" style="top: 37%; left: 91%;">
            {{ form.pitch }}
            <span class="label">pitch</span>
        </div>
    </div>

    <div class="form-group torsion-extra-controls">
        <label for="numero_ciclos">Numero de ciclos:</label>
        <select name="numero_ciclos" id="numero_ciclos" required>
            <option value="1e3" {% if request.POST.numero_ciclos == '1e3' %}selected{% endif %}>1,000</option>
            <option value="1e4" {% if request.POST.numero_ciclos == '1e4' %}selected{% endif %}>10,000</option>
            <option value="1e5" {% if request.POST.numero_ciclos == '1e5' %}selected{% endif %}>100,000</option>
            <option value="1e6" {% if request.POST.numero_ciclos == '1e6' %}selected{% endif %}>1,000,000</option>
            <option value="1e7" {% if request.POST.numero_ciclos == '1e7' %}selected{% endif %}>10,000,000</option>
        </select>
    </div>

    <h3>Calcular</h3>
    <p>Complete los datos del muelle para obtener sus especificaciones tecnicas completas.</p>
    <button type="submit" class="calculate-btn">Calcular Especificaciones</button>
</div>
