{% load static %}

<div class="spring-form-container">
    <div class="diagram-wrapper">
        <img src="{% static 'muelles/img/plano_muelle_torsion.jpg' %}" alt="Diagrama de muelle" class="spring-diagram">

        <!-- <div class="input-overlay d-field" style="top: 23%; left: 64%;">
        
            {{ form.d }}
            <span class="label">d</span>
        </div> -->

        <div class="input-overlay De-field" style="top: 40%; left: 5%;">
            <input type="number"
                    step="any"
                    name="diametro_exterior"
                    id="diametro_exterior"
                    value="{{ request.POST.diametro_exterior }}">
            <span class="label" data-tooltip="Diametro exterior (De) en mm"></span>
        </div>

        <div class="input-overlay Dm-field" style="top: 40%; left: 13%;">
            <input type="number"
                    step="any"
                    name="diametro_medio"
                    id="diametro_medio"
                    value="{{ request.POST.diametro_medio }}">
            <span class="label" data-tooltip="Diametro medio (Dm) en mm"></span>
        </div>

        <div class="input-overlay Di-field" style="top: 40%; left: 18%;">
            <input type="number"
                    step="any"
                    name="diametro_interior"
                    id="diametro_interior"
                    value="{{ request.POST.diametro_interior }}">
            <span class="label" data-tooltip="Diametro interior (Di) en mm"></span>
        </div>

        <div class="input-overlay Ls-field" style="top: 25%; left: 47.5%;">
            <input type="number"
                    step="any"
                    name="longitud_sujecion"
                    id="longitud_sujecion"
                    value="{{ request.POST.longitud_sujecion }}">
            <span class="label" data-tooltip="Longitud de pata fija (Ls) en mm"></span>
        </div>
        <div class="input-overlay Ra-field" style="top: 55%; left: 20%;">
            <input type="number"
                    step="any"
                    name="Radio_sujecion"
                    id="Radio_sujecion"
                    value="{{ request.POST.Radio_sujecion }}">
            <span class="label" data-tooltip="Radio de sujeción (Ra) pata móvil en mm"></span>
        </div>
        <div class="input-overlay A1-field" style="top: 67%; left: 33%;">
            <input type="number"
                    step="any"
                    name="angulo_inicial"
                    id="angulo_inicial"
                    value="{{ request.POST.angulo_inicial }}">
            <span class="label" data-tooltip="Primera posición de carga (A1)"></span>
        </div>
        <div class="input-overlay A2-field" style="top: 65%; left: 48%;">
            <input type="number"
                    step="any"
                    name="angulo_final"
                    id="angulo_final"
                    value="{{ request.POST.angulo_final }}">
            <span class="label" data-tooltip="Primera posición de carga (A2)"></span>
        </div>
        <div class="input-overlay angulo_libre" style="top: 75%; left: 50%;">
            <input type="number"
                    step="any"
                    name="angulo_libre"
                    id="angulo_libre"
                    value="{{ request.POST.angulo_libre }}">
            <span class="label" data-tooltip="Ángulo de libre (A0)"></span>
        </div>
        <div class="input-overlay nt-field" style="top: 38%; left: 85%;">
            <input type="number"
                    step="any"
                    name="numero_espiras"
                    id="numero_espiras"
                    value="{{ request.POST.numero_espiras }}">
            <span class="label" data-tooltip="Número de espiras (nt)"></span>
        
        </div>
        <div class="input-overlay pitch-field" style="top: 37%; left: 91%;">
            <input type="number"
                    step="any"
                    name="pitch"
                    id="pitch"
                    value="{{ request.POST.pitch }}">
            <span class="label" data-tooltip="Paso (pitch) en mm"></span>
        </div>
    </div>

    <h3>Calcular</h3>
    <p>Complete los datos del muelle para obtener sus especificaciones tecnicas completas.</p>
    <button type="submit" class="calculate-btn">Calcular Especificaciones</button>
</div>
